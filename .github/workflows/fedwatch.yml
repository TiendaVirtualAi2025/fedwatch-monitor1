name: CME FedWatch Monitor
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y xvfb curl
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.40.0'
          python -m playwright install --with-deps chromium
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python fedwatch.py
      - name: Save state
        if: always()
        run: |
          if [ -f fedwatch_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add fedwatch_state.json
            git diff --cached --quiet || git commit -m 'Update FedWatch state'
            git push
          fi
