name: FedWatch Monitor

on:

  workflow_dispatch:

  schedule:

    # Cada 15 minutos
    - cron: "*/15 * * * *"


jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # DESCARGAR REPOSITORIO
      # ======================================================

      - name: Descargar código

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # RESTAURAR ESTADO ANTERIOR
      # ======================================================

      - name: Restaurar estado FedWatch

        uses: actions/cache/restore@v4

        with:

          path: last_state.json

          key: fedwatch-state-${{ github.run_id }}

          restore-keys: |
            fedwatch-state-


      # ======================================================
      # CREAR ESTADO INICIAL
      # ======================================================

      - name: Preparar estado

        run: |

          if [ ! -f last_state.json ]; then
            echo '{"event":null,"value":0,"rate":null,"meeting_date":null}' > last_state.json
          fi

          echo ""
          echo "=========================================="
          echo "ESTADO ANTERIOR"
          echo "=========================================="

          cat last_state.json

          echo ""
          echo "=========================================="


      # ======================================================
      # INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias

        run: |

          python -m pip install --upgrade pip

          pip install requests playwright


      # ======================================================
      # INSTALAR CHROMIUM
      # ======================================================

      - name: Instalar navegador Chromium

        run: |

          python -m playwright install chromium

          python -m playwright install-deps chromium


      # ======================================================
      # EJECUTAR FEDWATCH
      # ======================================================

      - name: Ejecutar FedWatch

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |

          python fedwatch.py


      # ======================================================
      # MOSTRAR ESTADO FINAL
      # ======================================================

      - name: Mostrar estado final

        if: always()

        run: |

          echo ""
          echo "=========================================="
          echo "ESTADO FINAL"
          echo "=========================================="

          if [ -f last_state.json ]; then
            cat last_state.json
          else
            echo "No existe last_state.json"
          fi

          echo ""
          echo "=========================================="


      # ======================================================
      # GUARDAR ESTADO
      # ======================================================

      - name: Guardar estado FedWatch

        if: success()

        uses: actions/cache/save@v4

        with:

          path: last_state.json

          key: fedwatch-state-${{ github.run_id }}


      # ======================================================
      # GUARDAR ARCHIVO DE DEBUG SI FALLA
      # ======================================================

      - name: Guardar diagnóstico CME

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: fedwatch-debug-${{ github.run_id }}

          path: |

            cme_debug.txt
            last_state.json

          if-no-files-found: ignore