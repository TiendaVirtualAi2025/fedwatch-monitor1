name: FedWatch Monitor

on:

  workflow_dispatch:

  schedule:

    - cron: "*/15 * * * *"


jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # DESCARGAR REPOSITORIO
      # ======================================================

      - name: Descargar código

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # RESTAURAR ESTADO
      # ======================================================

      - name: Restaurar estado FedWatch

        uses: actions/cache/restore@v4

        with:

          path: last_state.json

          key: fedwatch-state-${{ github.run_id }}

          restore-keys: |
            fedwatch-state-


      # ======================================================
      # CREAR ESTADO SI NO EXISTE
      # ======================================================

      - name: Preparar estado

        run: |

          echo ""
          echo "=========================================="
          echo "PREPARANDO ESTADO"
          echo "=========================================="

          if [ ! -f last_state.json ]; then

            echo '{"event":null,"value":0,"rate":null,"meeting_date":null}' > last_state.json

          fi

          echo ""
          echo "Estado:"
          cat last_state.json

          echo ""
          echo "=========================================="


      # ======================================================
      # INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias

        run: |

          python -m pip install --upgrade pip

          pip install requests

          pip install cme-fedwatch


      # ======================================================
      # VERIFICAR INSTALACIÓN
      # ======================================================

      - name: Verificar FedWatch

        run: |

          echo ""
          echo "=========================================="
          echo "VERIFICANDO CME FEDWATCH"
          echo "=========================================="

          python -c "import cme_fedwatch; print('cme-fedwatch instalado correctamente')"

          echo ""
          python -c "import requests; print('requests instalado correctamente')"

          echo ""
          echo "=========================================="


      # ======================================================
      # VERIFICAR ARCHIVO
      # ======================================================

      - name: Verificar fedwatch.py

        run: |

          echo ""
          echo "=========================================="
          echo "VERIFICANDO fedwatch.py"
          echo "=========================================="

          pwd

          echo ""

          ls -lah

          echo ""

          echo "Cantidad de líneas:"

          wc -l fedwatch.py

          echo ""

          echo "=========================================="


      # ======================================================
      # EJECUTAR FEDWATCH
      # ======================================================

      - name: Ejecutar FedWatch

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |

          echo ""
          echo "=========================================="
          echo "EJECUTANDO FEDWATCH"
          echo "=========================================="

          python -u fedwatch.py

          echo ""
          echo "=========================================="
          echo "FEDWATCH TERMINÓ"
          echo "=========================================="


      # ======================================================
      # MOSTRAR ESTADO FINAL
      # ======================================================

      - name: Mostrar estado final

        if: always()

        run: |

          echo ""
          echo "=========================================="
          echo "ESTADO FINAL"
          echo "=========================================="

          if [ -f last_state.json ]; then

            cat last_state.json

          else

            echo "No existe last_state.json"

          fi

          echo ""
          echo "=========================================="


      # ======================================================
      # GUARDAR ESTADO
      # ======================================================

      - name: Guardar estado FedWatch

        if: success()

        uses: actions/cache/save@v4

        with:

          path: last_state.json

          key: fedwatch-state-${{ github.run_id }}


      # ======================================================
      # GUARDAR DIAGNÓSTICO
      # ======================================================

      - name: Guardar diagnóstico

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: fedwatch-debug-${{ github.run_id }}

          path: |

            last_state.json

          if-no-files-found: ignore