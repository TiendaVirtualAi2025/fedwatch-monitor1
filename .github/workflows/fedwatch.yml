name: FedWatch Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - - name: Instalar dependencias
  run: pip install requests cme-fedwatch

      - name: Ejecutar FedWatch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fedwatch.py